# Shipwright example — extends the base AF Stack compose.
#
# Usage (from repo root):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f examples/02-shipwright/docker-compose.yml \
#     up

services:
  # Shipwright stub agent. Same node_id ("shipwright") + reasoner name
  # ("run") as the eventual real SWE-AF agent.
  shipwright-agent:
    build:
      context: ./examples/02-shipwright/agents/shipwright
      dockerfile: Dockerfile
    environment:
      AGENTFIELD_SERVER: http://agentfield:8080
      NODE_ID: shipwright-v2
      AGENT_CALLBACK_URL: http://shipwright-agent:8090
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      agentfield:
        condition: service_started
    restart: unless-stopped

  # FastAPI sidecar — task CRUD + agent dispatch.
  shipwright-api:
    build:
      context: ./examples/02-shipwright/handlers
      dockerfile: Dockerfile
    environment:
      SHIPWRIGHT_DATABASE_URL: postgres://afstack:afstack@postgres:5432/afstack?sslmode=disable
      AF_STACK_URL: http://runtime:8080
      SHIPWRIGHT_AGENT: shipwright-v2.execute_task
    ports:
      - "${SHIPWRIGHT_PORT:-8201}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
    restart: unless-stopped

  # Make sure the migration runs before the sidecar starts.
  shipwright-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: afstack
    volumes:
      - ./examples/02-shipwright/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql -h postgres -U afstack -d afstack -f $$f
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
