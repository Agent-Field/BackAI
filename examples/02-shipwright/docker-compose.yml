# Shipwright example — extends the base AF Stack compose.
#
# Usage (from repo root):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f examples/02-shipwright/docker-compose.yml \
#     up
#
# Two agents are wired in this compose:
#
#  1. shipwright-agent  — the stub at examples/02-shipwright/agents/shipwright/
#                         (node_id=shipwright-v2, reasoner=execute_task).
#                         Simulates 7 steps in ~10s. No API keys needed.
#                         Good for iterating on the UI.
#
#  2. swe-af-agent      — the REAL SWE-AF library at examples/af-swe/.
#                         (node_id=swe-planner, reasoner=build).
#                         Needs ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN)
#                         + GH_TOKEN to actually do work, but registers
#                         either way so the UI can route to it.
#
# The workload module (shipwright-api) routes to one of the two via
# SHIPWRIGHT_AGENT env var. Default: the real SWE-AF. To switch back to
# the stub for fast iteration: set SHIPWRIGHT_AGENT=shipwright-v2.execute_task.

services:
  # Stub agent — fast iteration on the UI without burning API credits.
  shipwright-agent:
    build:
      context: ./examples/02-shipwright/agents/shipwright
      dockerfile: Dockerfile
    environment:
      AGENTFIELD_SERVER: http://agentfield:8080
      NODE_ID: shipwright-v2
      AGENT_CALLBACK_URL: http://shipwright-agent:8090
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      agentfield:
        condition: service_started
    restart: unless-stopped

  # The actual SWE-AF library — full autonomous engineering pipeline.
  # Builds from /Users/santoshkumarradha/Documents/agentfield/code/examples/af-swe.
  # Volume mounts the workspaces dir for persistent build artifacts.
  swe-af-agent:
    build:
      context: /Users/santoshkumarradha/Documents/agentfield/code/examples/af-swe
      dockerfile: Dockerfile
    environment:
      AGENTFIELD_SERVER: http://agentfield:8080
      NODE_ID: swe-planner
      AGENT_CALLBACK_URL: http://swe-af-agent:8003
      PORT: 8003
      # Credentials for real builds. Without these the agent still registers
      # but actual build calls will fail with a clear error.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GH_TOKEN:-}
      HARNESS_MODEL: ${HARNESS_MODEL:-openrouter/moonshotai/kimi-k2.6}
    volumes:
      - swe-af-workspaces:/workspaces
    depends_on:
      agentfield:
        condition: service_started
    restart: unless-stopped

  # FastAPI sidecar — task CRUD + agent dispatch.
  shipwright-api:
    build:
      context: ./examples/02-shipwright/handlers
      dockerfile: Dockerfile
    environment:
      SHIPWRIGHT_DATABASE_URL: postgres://afstack:afstack@postgres:5432/afstack?sslmode=disable
      AF_STACK_URL: http://runtime:8080
      # Default: route to the real SWE-AF. Override with
      #   SHIPWRIGHT_AGENT=shipwright-v2.execute_task
      # in .env to use the iteration stub instead.
      SHIPWRIGHT_AGENT: ${SHIPWRIGHT_AGENT:-swe-planner.build}
      SHIPWRIGHT_MODE: ${SHIPWRIGHT_MODE:-async}
    ports:
      - "${SHIPWRIGHT_PORT:-8201}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
    restart: unless-stopped

  # Make sure the migration runs before the sidecar starts.
  shipwright-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: afstack
    volumes:
      - ./examples/02-shipwright/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql -h postgres -U afstack -d afstack -f $$f
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  swe-af-workspaces:
