# Shipwright example — adds a coding-agent node to the root AF Stack.

include:
  - ../../docker-compose.yml

services:
  shipwright-agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTFIELD_SERVER: http://agentfield:8080
      NODE_ID: shipwright
      AGENT_CALLBACK_URL: http://shipwright-agent:8090
      AF_STACK_URL: http://runtime:8080
      AF_STACK_API_KEY: ${AF_STACK_API_KEY:-}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}

      SHIPWRIGHT_MODEL: ${SHIPWRIGHT_MODEL:-openrouter/google/gemini-2.5-flash}
      SHIPWRIGHT_HARNESS: ${SHIPWRIGHT_HARNESS:-codex}
      SHIPWRIGHT_HARNESS_BUDGET_USD: ${SHIPWRIGHT_HARNESS_BUDGET_USD:-0.50}
      SHIPWRIGHT_HARNESS_MAX_TURNS: ${SHIPWRIGHT_HARNESS_MAX_TURNS:-20}
      SHIPWRIGHT_HARNESS_PERMISSION_MODE: ${SHIPWRIGHT_HARNESS_PERMISSION_MODE:-danger-full-access}
      SHIPWRIGHT_BASE_BRANCH: ${SHIPWRIGHT_BASE_BRANCH:-main}
      SHIPWRIGHT_DRAFT_PR: ${SHIPWRIGHT_DRAFT_PR:-true}
      SHIPWRIGHT_PATCH_DIR: /var/lib/shipwright/patches
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOME: /root
      CODEX_HOME: /root/.codex
    volumes:
      - shipwright-patches:/var/lib/shipwright/patches
      - shipwright-codex-home:/root/.codex
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
      - ${HOME}/.codex/config.toml:/root/.codex/config.toml:ro
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.gemini:/root/.gemini:ro
    depends_on:
      agentfield:
        condition: service_started
      runtime:
        condition: service_started
    restart: unless-stopped

volumes:
  shipwright-patches:
  shipwright-codex-home:
