# Shipwright example — extends the base BackAI compose.
#
# Usage (from repo root):
#   docker compose \
#     -f docker-compose.yml \
#     -f examples/02-shipwright/docker-compose.yml \
#     up
#
# One agent is wired in this compose:
#
#  shipwright-agent — the real coding agent at
#                     examples/02-shipwright/agents/shipwright/
#                     (node_id=shipwright, reasoner=build → call shipwright.build).
#                     Given GH_TOKEN + a repo_url it clones, runs a coding
#                     harness (or an honest file-edit fallback when no harness
#                     binary is present), pushes a branch, and opens a real PR.
#
# The workload module (shipwright-api) routes to it via the SHIPWRIGHT_AGENT
# env var. Default: shipwright.build (the canonical agent call).

services:
  # Real coding agent — clone → harness → push → open PR.
  shipwright-agent:
    build:
      context: ./examples/02-shipwright/agents/shipwright
      dockerfile: Dockerfile
    environment:
      AGENTFIELD_SERVER: http://agentfield:8080
      NODE_ID: shipwright
      AGENT_CALLBACK_URL: http://shipwright-agent:8090
      # GitHub credential for clone + PR creation. Without it the agent still
      # registers, but build calls return a clear "missing_credential".
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GH_TOKEN:-}
      # Runtime base + key for the best-effort completion callback.
      AF_STACK_URL: http://runtime:8080
      AF_STACK_API_KEY: ${AF_STACK_API_KEY:-}
      # Harness selection + credentials (any one enables that harness).
      SHIPWRIGHT_HARNESS: ${SHIPWRIGHT_HARNESS:-}
      SHIPWRIGHT_MODEL: ${SHIPWRIGHT_MODEL:-}
      SHIPWRIGHT_BASE_BRANCH: ${SHIPWRIGHT_BASE_BRANCH:-main}
      SHIPWRIGHT_DRAFT_PR: ${SHIPWRIGHT_DRAFT_PR:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - shipwright-workspaces:/workspaces
    depends_on:
      agentfield:
        condition: service_started
    restart: unless-stopped

  # FastAPI sidecar — task CRUD + agent dispatch.
  shipwright-api:
    build:
      context: ./examples/02-shipwright/handlers
      dockerfile: Dockerfile
    environment:
      SHIPWRIGHT_DATABASE_URL: postgres://afstack:afstack@postgres:5432/afstack?sslmode=disable
      AF_STACK_URL: http://runtime:8080
      # Canonical agent call. All three of runtime default, compose, and the
      # agent's own node_id.reasoner agree on shipwright.build.
      SHIPWRIGHT_AGENT: ${SHIPWRIGHT_AGENT:-shipwright.build}
      SHIPWRIGHT_MODE: ${SHIPWRIGHT_MODE:-async}
    ports:
      - "${SHIPWRIGHT_PORT:-38201}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
    restart: unless-stopped

  # Make sure the migration runs before the sidecar starts.
  shipwright-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: afstack
    volumes:
      - ./examples/02-shipwright/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql -h postgres -U afstack -d afstack -f $$f
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  shipwright-workspaces:
