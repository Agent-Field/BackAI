{{- /*
Chart-managed Secret. Only rendered when the operator supplied any
*inline* sensitive values. Production deployments should rely on
external Secret references (kmsKeySecretRef, providerSecretRef,
credentialsSecretRef, postgresql.external.urlSecretRef) and skip this
template entirely.
*/ -}}
{{- if eq (include "af-stack.needsInlineSecret" .) "true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "af-stack.secretName" . }}
  labels:
    {{- include "af-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (eq (include "af-stack.databaseUrlSource" .) "inline") .Values.postgresql.external.url }}
  AF_STACK_DATABASE_URL: {{ .Values.postgresql.external.url | quote }}
  {{- end }}
  {{- if and (not .Values.secrets.kmsKeySecretRef.name) .Values.secrets.kmsKey }}
  AF_STACK_KMS_KEY: {{ .Values.secrets.kmsKey | quote }}
  {{- end }}
  {{- if and (not .Values.secrets.authSecretSecretRef.name) .Values.secrets.authSecret }}
  AF_STACK_AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  {{- end }}
  {{- if and (eq .Values.storage.mode "s3") (not .Values.storage.s3.credentialsSecretRef.name) }}
    {{- if .Values.storage.s3.accessKey }}
  AF_STACK_S3_ACCESS_KEY: {{ .Values.storage.s3.accessKey | quote }}
    {{- end }}
    {{- if .Values.storage.s3.secretKey }}
  AF_STACK_S3_SECRET_KEY: {{ .Values.storage.s3.secretKey | quote }}
    {{- end }}
  {{- end }}
  {{- if not .Values.llm.providerSecretRef.name }}
    {{- if .Values.llm.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ .Values.llm.openrouterApiKey | quote }}
    {{- end }}
    {{- if .Values.llm.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | quote }}
    {{- end }}
    {{- if .Values.llm.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.llm.openaiApiKey | quote }}
    {{- end }}
    {{- if .Values.llm.googleApiKey }}
  GOOGLE_API_KEY: {{ .Values.llm.googleApiKey | quote }}
    {{- end }}
  {{- end }}
{{- end }}
