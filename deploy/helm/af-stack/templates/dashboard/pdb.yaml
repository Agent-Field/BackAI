{{- if .Values.podDisruptionBudget.dashboard.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "af-stack.dashboard.fullname" . }}
  labels:
    {{- include "af-stack.dashboard.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.dashboard.minAvailable }}
  selector:
    matchLabels:
      {{- include "af-stack.dashboard.selectorLabels" . | nindent 6 }}
{{- end }}
