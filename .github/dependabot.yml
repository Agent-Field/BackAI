version: 2

# Updates land as PRs. Security-only entries fire on advisory feeds;
# version-bump entries fire on the configured cadence.
#
# Group runtime + dashboard + SDK by ecosystem to avoid a flood of
# individual PRs. Ignore major version bumps by default — those need
# human review.

updates:
  # ─── Go: the runtime + CLI ──────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - go

  # ─── npm: pnpm workspace (dashboard, customer-app, sdk-ts) ─────────────
  # Update from the repo root. Per-package directories fail with
  # "Updating workspaces from inside a workspace subdirectory is not
  # supported" and show up as a red Dependabot check on main.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      js-workspace:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - npm

  # ─── npm: docs site ─────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    groups:
      docs-site-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - npm
      - docs-site

  # ─── pip: Python SDK ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/sdk-py
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    groups:
      sdk-py-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - pip
      - sdk-py

  # ─── docker: base images ───────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /services/runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/customer-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - docker

  # ─── github-actions: workflow files ────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - ci
