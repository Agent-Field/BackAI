name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC every Monday so security issues surface before a workweek.
    - cron: '0 3 * * 1'

# This repo is currently PRIVATE without GitHub Advanced Security, so the
# code-scanning SARIF upload API (github/codeql-action/upload-sarif) returns
# 403 "Resource not accessible by integration". To keep this workflow green and
# useful without GHAS:
#   - gosec / trivy run as scanners and publish their SARIF as downloadable
#     build artifacts + a job summary (no code-scanning upload).
#   - npm audit / pip-audit remain hard, blocking dependency gates.
#   - CodeQL only runs when the repo is public (it inherently uploads to
#     code-scanning), so it auto-activates at open-source launch.
permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: gosec (Go runtime + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run gosec
        uses: securego/gosec@master
        with:
          # Standard rule set; the high-noise rules (G104 for unchecked
          # errors) are excluded so the report is meaningful. -no-fail keeps
          # this report-only — the SARIF artifact below carries the findings.
          args: '-fmt sarif -out gosec.sarif -no-fail -exclude G104 ./services/...'
      - name: Summarize high-severity findings
        if: always()
        run: |
          if [ -f gosec.sarif ]; then
            high=$(python3 -c "import json;d=json.load(open('gosec.sarif'));r=d['runs'][0];rules={x['id']:x for x in r['tool']['driver'].get('rules',[])};print(sum(1 for x in r['results'] if (x.get('level')=='error')))" 2>/dev/null || echo '?')
            echo "### gosec — $high error-level finding(s)" >> "$GITHUB_STEP_SUMMARY"
            echo "Full SARIF is attached as the \`gosec-sarif\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif
          path: gosec.sarif
          if-no-files-found: ignore

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - apps/dashboard
          - packages/sdk-ts
          - docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ matrix.workspace }}
        run: npm install --omit=dev
      - name: Audit
        working-directory: ${{ matrix.workspace }}
        # --audit-level=high gates on high/critical only; moderate +
        # below flow through Dependabot rather than blocking the build.
        run: npm audit --audit-level=high --omit=dev

  pip-audit:
    name: pip-audit (sdk-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit
        working-directory: packages/sdk-py
        # --vulnerability-service=osv preferred — has wider coverage
        # than PyPI's index alone.
        run: pip-audit --vulnerability-service=osv

  trivy:
    name: trivy fs scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (table to log + summary)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: 'HIGH,CRITICAL'
          scanners: vuln
          format: table
          ignore-unfixed: true
          output: trivy.txt
      - name: Trivy (SARIF artifact)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: 'HIGH,CRITICAL'
          scanners: vuln
          format: sarif
          ignore-unfixed: true
          output: trivy.sarif
      - name: Job summary
        if: always()
        run: |
          {
            echo "### trivy fs scan (HIGH/CRITICAL, fixed-only)"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
            echo "Full SARIF is attached as the \`trivy-sarif\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: ignore

  codeql:
    name: CodeQL
    # CodeQL inherently uploads to GitHub code-scanning, which needs Advanced
    # Security on a private repo. Run it only once the repo is public, where
    # code scanning is free — so it auto-activates at open-source launch.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript', 'python']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
