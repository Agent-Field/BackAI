[project]
name = "af-stack"
version = "0.0.1"
description = "AF Stack — Suite SDK for Python. Call agents and use suite infrastructure from Python."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent-Field" }]
requires-python = ">=3.11"
dependencies = [
    "httpx >= 0.27",
    "pydantic >= 2.0",
    "anyio >= 4.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.24",
    "respx >= 0.21",
    "mypy >= 1.10",
    "ruff >= 0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["af_stack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
