[project]
name = "af-stack-backend"
version = "0.0.1"
description = "AF Stack backend application — agents, handlers, jobs, crons. Per-deployment user code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "af-stack",
]

[tool.uv.sources]
af-stack = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This package exists to satisfy the uv workspace; no production wheel is
# expected. Forks may add their own user code here.
packages = []
