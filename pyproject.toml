[project]
name = "af-stack-workspace"
version = "0.0.1"
description = "AF Stack monorepo workspace (TS + Py + Go)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.uv]
package = false  # this is a workspace, not a publishable package

[tool.uv.workspace]
members = [
    "packages/sdk-py",
    "apps/backend",
    "examples/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "**/build",
    "**/dist",
    "**/.venv",
    "**/__pycache__",
    "**/node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "ASYNC",
    "S",   # bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
    "S101",  # assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/sdk-py/tests", "apps/backend/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
